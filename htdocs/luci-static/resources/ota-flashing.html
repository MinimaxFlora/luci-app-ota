<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installing firmware</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: radial-gradient(circle at 50% 0, #1b2430 0, #0d1117 55%);
		color: #e6edf3;
		font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
		padding: 24px;
	}
	.card {
		width: min(520px, 100%);
		padding: 34px 32px 26px;
		border-radius: 18px;
		border: 1px solid rgba(255, 255, 255, .08);
		background: rgba(22, 27, 34, .92);
		box-shadow: 0 28px 70px rgba(0, 0, 0, .55);
		text-align: center;
	}
	.gh { width: 46px; height: 46px; margin: 0 auto 14px; display: block; animation: spin 2.4s linear infinite; }
	.gh path { fill: #e6edf3; }
	@keyframes spin { to { transform: rotate(360deg); } }
	h2 { margin: 0 0 6px; font-size: 1.35rem; color: #fff; }
	.sub { margin: 0; color: rgba(255, 255, 255, .7); font-size: 14px; }
	.danger { color: #ffb4a9; font-weight: 600; }
	ol { list-style: none; margin: 22px 0 0; padding: 0; text-align: left; }
	li { position: relative; padding: 6px 0 6px 26px; color: rgba(255, 255, 255, .45); font-size: 14px; }
	li::before {
		content: "";
		position: absolute; left: 0; top: 10px;
		width: 10px; height: 10px; border-radius: 50%;
		border: 2px solid rgba(255, 255, 255, .25);
	}
	li.active { color: #7ee2b8; }
	li.active::before { border-color: #2e9d72; background: #2e9d72; box-shadow: 0 0 0 4px rgba(46, 157, 114, .18); }
	li.done { color: rgba(255, 255, 255, .6); }
	li.done::before { border-color: #2e9d72; background: #2e9d72; }
	.foot { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .1); color: rgba(255, 255, 255, .6); font-size: 13px; }
	.foot b { color: rgba(255, 255, 255, .85); font-weight: 600; }
	a { color: #7ee2b8; }
</style>
</head>
<body>
	<div class="card">
		<svg class="gh" viewBox="0 0 16 16" role="img" aria-label="GitHub">
			<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
		</svg>
		<h2 id="title">Installing firmware</h2>
		<p class="sub"><span class="danger" id="warn">Do not power off the device.</span> <span id="sub">The page reconnects automatically once it is back.</span></p>
		<ol id="steps">
			<li data-step="write">Writing the system partition</li>
			<li data-step="verify">Verifying the image</li>
			<li data-step="reboot">Rebooting the device</li>
			<li data-step="reconnect">Reconnecting to the web interface</li>
		</ol>
		<p class="foot"><span id="elapsed-label">Elapsed</span> <b id="elapsed">0:00</b> · <span id="hint">Usually takes 1-3 minutes.</span></p>
		<p class="foot" id="manual" hidden></p>
	</div>
<script>
(function () {
	var zh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
	var text = {
		title:   [ 'Installing firmware', '正在安装固件' ],
		warn:    [ 'Do not power off the device.', '请勿断电。' ],
		sub:     [ 'The page reconnects automatically once it is back.', '设备恢复后页面会自动重新连接。' ],
		write:   [ 'Writing the system partition', '写入系统分区' ],
		verify:  [ 'Verifying the image', '校验镜像' ],
		reboot:  [ 'Rebooting the device', '重启设备' ],
		reconnect: [ 'Reconnecting to the web interface', '重新连接管理界面' ],
		elapsedLabel: [ 'Elapsed', '已用时间' ],
		hint:    [ 'Usually takes 1-3 minutes.', '通常需要 1-3 分钟。' ],
		manual:  [ 'If the page does not come back, open this address manually:', '如果页面没有自动恢复，请手动打开这个地址：' ],
		gone:    [ 'The device did not come back. Check it and open the web interface manually.', '设备没有恢复，请检查设备并手动打开管理界面。' ]
	};
	var t = function (key) { return text[key][zh ? 1 : 0]; };

	document.documentElement.lang = zh ? 'zh-cn' : 'en';
	document.title = t('title');
	document.getElementById('title').textContent = t('title');
	document.getElementById('warn').textContent = t('warn');
	document.getElementById('sub').textContent = t('sub');
	document.getElementById('elapsed-label').textContent = t('elapsedLabel');
	document.getElementById('hint').textContent = t('hint');

	var steps = document.getElementById('steps').children;
	var labels = [ 'write', 'verify', 'reboot', 'reconnect' ];
	for (var i = 0; i < steps.length; i++)
		steps[i].textContent = t(labels[i]);

	var start = Date.now();
	var elapsed = document.getElementById('elapsed');
	var target = window.location.protocol + '//' + window.location.host;
	var probeStarted = false;
	var wentDown = false;
	var stopped = false;

	function fmt(seconds) {
		var m = Math.floor(seconds / 60);
		var s = seconds % 60;

		return m + ':' + (s < 10 ? '0' : '') + s;
	}

	function phase(seconds) {
		if (seconds < 20) return 0;
		if (seconds < 40) return 1;
		if (seconds < 55) return 2;

		return 3;
	}

	function paint() {
		var seconds = Math.round((Date.now() - start) / 1000);
		var current = phase(seconds);

		for (var i = 0; i < steps.length; i++)
			steps[i].className = (i < current) ? 'done' : (i === current ? 'active' : '');

		elapsed.textContent = fmt(seconds);

		if (!stopped)
			window.setTimeout(paint, 1000);
	}

	function finish() {
		stopped = true;
		steps[3].className = 'done';
		/* The LuCI session is gone after a reboot: go to the device root and
		 * let it land on the login page. */
		window.location.replace(target + '/');
	}

	function giveUp() {
		stopped = true;

		var node = document.getElementById('manual');
		node.hidden = false;
		node.innerHTML = '';
		node.appendChild(document.createTextNode(t('gone') + ' '));
		var link = document.createElement('a');
		link.href = target + '/';
		link.textContent = target + '/';
		node.appendChild(link);
	}

	function probe() {
		if (stopped)
			return;

		var img = new Image();

		img.onload = function () {
			if (wentDown)
				return finish();

			window.setTimeout(probe, 3000);
		};

		img.onerror = function () {
			wentDown = true;
			window.setTimeout(probe, 3000);
		};

		img.src = target + '/luci-static/resources/icons/loading.svg?t=' + Date.now();
	}

	paint();
	window.setTimeout(function () {
		probeStarted = true;
		probe();
	}, 45000);

	/* Nothing can come back after fifteen minutes: show the manual link. */
	window.setTimeout(function () {
		if (!stopped)
			giveUp();
	}, 15 * 60 * 1000);
})();
</script>
</body>
</html>
